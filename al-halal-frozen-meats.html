<title>الحلال | لحوم وأغذية مجمدة</title>
<style>
  :root{
    --gold:#E89B1F;
    --gold-light:#F4BE63;
    --gold-deep:#A66A10;
    --cream:#FBEDD5;
    --red:#82090E;
    --ink:#0a0504;
    --ink-2:#160907;
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0;padding:0;
    height:100%;width:100%;
    overflow:hidden;
    position:fixed;
    inset:0;
    background:var(--ink);
    overscroll-behavior:none;
    -webkit-user-select:none;
    user-select:none;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Tahoma,Arial,sans-serif;
    touch-action:manipulation;
  }

  /* ---------- Loading splash ---------- */
  .splash{
    position:fixed;
    inset:0;
    z-index:9999;
    background:
      radial-gradient(520px 440px at 50% 36%, rgba(232,155,31,.14), rgba(232,155,31,0) 60%),
      radial-gradient(700px 500px at 50% 90%, rgba(130,9,14,.28), rgba(130,9,14,0) 65%),
      var(--ink);
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    transition:opacity .55s ease, transform .6s ease;
  }
  .splash.hide{
    opacity:0;
    transform:scale(1.04);
    pointer-events:none;
  }

  .fridge-scene{
    position:relative;
    width:176px;
    height:234px;
    perspective:800px;
    animation:sceneShake .34s ease-out 1.78s;
  }
  @keyframes sceneShake{
    0%{transform:translateX(0) rotate(0deg);}
    18%{transform:translateX(-4px) rotate(-0.9deg);}
    36%{transform:translateX(3px) rotate(0.7deg);}
    54%{transform:translateX(-2px) rotate(-0.4deg);}
    72%{transform:translateX(1.2px) rotate(0.2deg);}
    100%{transform:translateX(0) rotate(0deg);}
  }
  .fridge{
    position:relative;
    width:100%;
    height:100%;
    transform-style:preserve-3d;
    opacity:0;
    animation:fridgeIn .4s ease forwards;
    filter:drop-shadow(0 16px 22px rgba(0,0,0,.5));
  }
  @keyframes fridgeIn{
    from{opacity:0; transform:translateY(8px) scale(.94);}
    to{opacity:1; transform:translateY(0) scale(1);}
  }
  .fridge-static,.fridge-door{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
  }
  .fridge-static svg,.fridge-door svg{width:100%;height:100%;display:block;}
  .fridge-door{
    transform-origin:100% 50%;
    backface-visibility:hidden;
    animation:
      doorOpen .5s cubic-bezier(.3,0,.2,1) forwards .22s,
      doorClose .28s cubic-bezier(.55,0,.85,.35) forwards 1.5s;
  }
  @keyframes doorOpen{
    from{transform:rotateY(0deg);}
    to{transform:rotateY(-102deg);}
  }
  @keyframes doorClose{
    from{transform:rotateY(-102deg);}
    to{transform:rotateY(0deg);}
  }

  .item{
    opacity:0;
    transform-origin:center bottom;
    animation:itemPop .34s cubic-bezier(.34,1.56,.64,1) forwards;
  }
  .item-1{animation-delay:.66s;}
  .item-2{animation-delay:.80s;}
  .item-3{animation-delay:.94s;}
  .item-4{animation-delay:1.08s;}
  @keyframes itemPop{
    0%{opacity:0; transform:translateY(9px) scale(.4);}
    70%{opacity:1; transform:translateY(-2px) scale(1.08);}
    100%{opacity:1; transform:translateY(0) scale(1);}
  }

  .frost-burst{
    position:absolute;
    left:3%;
    top:4%;
    bottom:6%;
    width:7px;
    border-radius:4px;
    background:radial-gradient(circle, rgba(255,255,255,.95), rgba(200,235,245,.55) 42%, transparent 72%);
    opacity:0;
    filter:blur(1.2px);
    animation:frostPulse .5s ease-out 1.78s;
    pointer-events:none;
  }
  @keyframes frostPulse{
    0%{opacity:0; transform:scaleX(1);}
    18%{opacity:.95; transform:scaleX(4.5);}
    100%{opacity:0; transform:scaleX(10);}
  }
  .ice-chip{
    position:absolute;
    width:7px;height:7px;
    left:5%;
    background:linear-gradient(135deg,#fff,#cdeaf2);
    clip-path:polygon(50% 0%,100% 50%,50% 100%,0% 50%);
    opacity:0;
    pointer-events:none;
  }
  .ice-1{top:20%; animation:iceFly1 .55s ease-out 1.82s;}
  .ice-2{top:46%; animation:iceFly2 .55s ease-out 1.86s;}
  .ice-3{top:66%; animation:iceFly3 .55s ease-out 1.84s;}
  @keyframes iceFly1{
    0%{opacity:0; transform:translate(0,0) rotate(0deg) scale(.6);}
    22%{opacity:1;}
    100%{opacity:0; transform:translate(-24px,-16px) rotate(140deg) scale(.9);}
  }
  @keyframes iceFly2{
    0%{opacity:0; transform:translate(0,0) rotate(0deg) scale(.6);}
    22%{opacity:1;}
    100%{opacity:0; transform:translate(-28px,4px) rotate(-120deg) scale(.9);}
  }
  @keyframes iceFly3{
    0%{opacity:0; transform:translate(0,0) rotate(0deg) scale(.6);}
    22%{opacity:1;}
    100%{opacity:0; transform:translate(-22px,18px) rotate(160deg) scale(.9);}
  }

  .load-wrap{
    position:relative;
    width:168px;
    height:1.5px;
    margin-top:24px;
  }
  .track{position:absolute; inset:0; background:rgba(232,155,31,.25);}
  .fill{
    position:absolute; left:0; top:0; height:100%;
    width:0%;
    background:linear-gradient(90deg, var(--gold-deep), var(--gold-light));
    animation:fillBar 2.05s ease-in-out forwards .12s;
  }
  @keyframes fillBar{to{width:100%;}}

  @media (prefers-reduced-motion:reduce){
    .splash{display:none;}
  }

  /* ---------- Main page ---------- */
  .stage{
    position:fixed;
    inset:0;
    height:100vh;
    height:100dvh;
    width:100vw;
    background:
      radial-gradient(560px 420px at 50% 6%, rgba(232,155,31,.11), rgba(232,155,31,0) 60%),
      radial-gradient(900px 700px at 50% 108%, rgba(130,9,14,.16), rgba(130,9,14,0) 55%),
      var(--ink);
  }
  .brand{
    position:absolute;
    left:0;right:0;
    top:calc(env(safe-area-inset-top, 0px) + 9vh);
    display:flex;
    flex-direction:column;
    align-items:center;
    opacity:0;
    translate:0 -12px;
    transition:opacity .6s ease, translate .6s cubic-bezier(.19,1,.22,1);
  }
  .brand.show{opacity:1;translate:0 0;}
  .logo-card{
    width:164px;
    height:164px;
    border-radius:50%;
    overflow:hidden;
    box-shadow:
      0 20px 40px rgba(0,0,0,.6),
      0 0 0 3px rgba(232,155,31,.85),
      0 0 34px rgba(232,155,31,.25);
  }
  .logo-card img{width:100%;height:100%;object-fit:cover;display:block;}

  .actions{
    position:absolute;
    left:0;right:0;
    bottom:calc(env(safe-area-inset-bottom, 0px) + 26px);
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:14px;
    padding:0 20px;
  }
  .btn{
    all:unset;
    box-sizing:border-box;
    display:flex;
    align-items:center;
    gap:14px;
    width:100%;
    max-width:340px;
    height:74px;
    padding:7px 24px 7px 7px;
    border-radius:999px;
    background:linear-gradient(155deg,#1c1310,#0a0504);
    box-shadow:
      0 14px 30px rgba(0,0,0,.55),
      inset 0 1px 0 rgba(255,255,255,.05),
      0 0 0 1px rgba(232,155,31,.22);
    cursor:pointer;
    -webkit-tap-highlight-color:transparent;
    transition:transform .15s ease, opacity .5s ease, translate .5s cubic-bezier(.19,1,.22,1), box-shadow .2s ease;
    opacity:0;
    translate:0 14px;
  }
  .actions.show .btn{opacity:1;translate:0 0;}
  .actions.show .btn:nth-of-type(1){transition-delay:.05s;}
  .actions.show .btn:nth-of-type(2){transition-delay:.16s;}
  .actions.show .btn:nth-of-type(3){transition-delay:.27s;}
  .btn:active{
    transform:scale(.965);
    box-shadow:
      0 10px 22px rgba(0,0,0,.5),
      inset 0 1px 0 rgba(255,255,255,.05),
      0 0 0 1px rgba(232,155,31,.55);
  }
  .badge{
    width:60px;
    height:60px;
    border-radius:18px;
    background:#fff;
    display:flex;
    align-items:center;
    justify-content:center;
    flex:0 0 auto;
    overflow:hidden;
    padding:5px;
    box-shadow:0 0 0 2px rgba(232,155,31,.55);
  }
  .badge img{width:100%;height:100%;object-fit:contain;display:block;}
  .label{
    flex:1;
    text-align:center;
    color:var(--cream);
    font-weight:700;
    font-size:17px;
    letter-spacing:.3px;
    white-space:nowrap;
  }
</style>
</head>
